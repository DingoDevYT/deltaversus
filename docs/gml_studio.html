<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DELTAVERSUS — GML Translator Studio</title>
<style>
  :root {
    --bg: #090a10;
    --panel: #13141f;
    --card: #1c1d2d;
    --border: #2c2d42;
    --accent: #ffe100;
    --accent-blue: #00d2ff;
    --ink: #e8e8f5;
    --dim: #8b8ca8;
    --code-bg: #0d0e17;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--accent);
  }
  header .tag {
    font-size: 11px;
    background: rgba(255,225,0,0.15);
    color: var(--accent);
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid rgba(255,225,0,0.3);
  }
  .controls-bar {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  select, button, input {
    font-family: inherit;
    font-size: 13px;
    border-radius: 6px;
    padding: 7px 12px;
    transition: all 0.15s ease;
  }
  select, input {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--border);
  }
  button {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--border);
    font-weight: 600;
    cursor: pointer;
  }
  button:hover {
    border-color: var(--accent);
    background: #25263a;
  }
  button.btn-primary {
    background: var(--accent);
    color: #000;
    border: none;
  }
  button.btn-primary:hover {
    background: #ffd000;
    box-shadow: 0 0 12px rgba(255,225,0,0.4);
  }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 12px;
    height: calc(100vh - 57px);
  }

  .editor-section, .preview-section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .tabs {
    display: flex;
    background: #0e0f18;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 10px 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--dim);
    cursor: pointer;
    border-right: 1px solid var(--border);
    user-select: none;
  }
  .tab.active {
    color: var(--accent-blue);
    background: var(--panel);
    border-bottom: 2px solid var(--accent-blue);
  }

  .code-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 10px;
    gap: 10px;
    overflow-y: auto;
  }

  .code-box {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }
  .code-box label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--dim);
    font-weight: 700;
  }
  textarea {
    flex: 1;
    background: var(--code-bg);
    color: #a6e22e;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.4;
    resize: none;
    outline: none;
  }
  textarea:focus {
    border-color: var(--accent-blue);
  }

  .preview-section {
    align-items: center;
    justify-content: center;
    position: relative;
    background: #000;
  }

  canvas {
    background: #000;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 2px solid #222;
    border-radius: 4px;
    max-width: 100%;
    max-height: 100%;
  }

  .hud-overlay {
    position: absolute;
    top: 12px;
    left: 12px;
    font-size: 13px;
    color: #fff;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  .hud-overlay b { color: var(--accent); }

  /* Stacked so the sprite and engine readouts don't overlap each other. */
  .status-readouts {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    pointer-events: none;
  }
  .sprite-status {
    font-size: 11px;
    color: var(--dim);
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    text-align: right;
  }

  .output-code {
    background: var(--code-bg);
    color: #f8f8f2;
    padding: 10px;
    font-family: monospace;
    font-size: 12px;
    white-space: pre-wrap;
    overflow-y: auto;
    flex: 1;
  }
  .error-log {
    background: #1a0808;
    color: #ff6b6b;
    padding: 8px 12px;
    font-size: 11px;
    font-family: monospace;
    border-top: 1px solid #4a1515;
    max-height: 120px;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  .error-log:empty { display: none; }
  .volwrap {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--dim);
    font-size: 14px;
    user-select: none;
  }
  .volwrap input { width: 90px; accent-color: #ffd93b; }
</style>
</head>
<body>

<header>
  <h1>DELTAVERSUS <span class="tag">GML Translator Studio v2</span></h1>
  <div class="controls-bar">
    <select id="presetSelect">
      <option value="">-- Load GML Object Preset --</option>
      <option value="knight_star">Knight — Pointing Star (Stars Attack)</option>
      <option value="knight_tunnel">Knight — Sword Tunnel</option>
      <option value="gerson_squish">Gerson — Squishes Box</option>
      <option value="sneo_wall">Spamton NEO — Wall Controller</option>
    </select>
    <button id="btnTranslate" class="btn-primary">▶ Transpile & Play</button>
    <button id="btnReset">↻ Reset</button>
    <button id="btnPause">⏸ Pause</button>
    <select id="diffSelect" title="Attack difficulty (dc.difficulty / boss.difficulty)">
      <!-- 0 is the GAME's default: obj_dbulletcontroller's Create sets
           `difficulty = 0` (line 21) and so does obj_spamton_neo_enemy's
           (line 54). Defaulting the studio to 1 silently ran every attack on
           its harder branch — Spamton NEO's HeartAttackNeo took the
           `rr == 2 && difficulty == 1` path for turntimer 850 instead of 750,
           and the Knight's boxsplitter and rotating slash both read
           difficulty 1 where the source says 0. -->
      <option value="0" selected>DIFF 0</option>
      <option value="1">DIFF 1</option>
      <option value="2">DIFF 2</option>
    </select>
    <label class="volwrap" id="hellWrap" style="display:none" title="Spamton NEO hellmode (dc.special)"><input type="checkbox" id="hellChk">HELL</label>
    <label class="volwrap" title="Sound volume">🔊<input type="range" id="volSlider" min="0" max="100" step="1"></label>
  </div>
</header>

<main>
  <!-- Left: GML Input / Transpiled JS -->
  <div class="editor-section">
    <div class="tabs">
      <div class="tab active" data-tab="gml">GML Object Events</div>
      <div class="tab" data-tab="js">Generated JS Class</div>
    </div>
    <div id="tabGML" class="code-container">
      <div class="code-box" style="flex:none">
        <label>GameMaker Object Name</label>
        <input type="text" id="objName" value="obj_knight_pointing_star" style="background:var(--code-bg);color:var(--ink);border:1px solid var(--border);padding:6px;border-radius:4px;font-family:monospace">
      </div>
      <div class="code-box">
        <label>Create Event (Create_0.gml)</label>
        <textarea id="gmlCreate" placeholder="// Create_0.gml code..."></textarea>
      </div>
      <div class="code-box">
        <label>Step Event (Step_0.gml)</label>
        <textarea id="gmlStep" placeholder="// Step_0.gml code..."></textarea>
      </div>
      <div class="code-box">
        <label>Draw Event (Draw_0.gml)</label>
        <textarea id="gmlDraw" placeholder="// Optional Draw_0.gml code..."></textarea>
      </div>
    </div>
    <div id="tabJS" class="code-container" style="display:none">
      <div class="output-code" id="jsResult">// Transpiled JavaScript will appear here...</div>
    </div>
    <div style="margin-top:12px;display:flex;align-items:center;justify-content:space-between">
      <label style="font-weight:bold;color:#ff5a5a;font-size:12px">ACCUMULATED UNIQUE ERRORS (<span id="errCount">0</span>)</label>
      <div>
        <button id="btnClearErrors" style="background:#2a2e3a;color:#aaa;border:1px solid #4a4e5d;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px;margin-right:6px">🗑️ Clear</button>
        <button id="btnCopyErrors" style="background:#38d878;color:#000;border:1px solid #38d878;font-weight:bold;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px">📋 Copy All Unique Errors</button>
      </div>
    </div>
    <div id="errorLog" class="error-log"></div>
  </div>

  <!-- Right: Live Canvas Preview -->
  <div class="preview-section">
    <div class="hud-overlay">
      <div>Status: <b id="statusText">Ready</b></div>
      <div>FPS: <span id="fpsText">60</span> | Instances: <span id="instCount">0</span></div>
      <div style="font-size:11px;color:var(--dim);margin-top:4px">Move SOUL with WASD or Arrow Keys</div>
    </div>
    <div class="status-readouts">
      <div class="sprite-status" id="spriteStatus">Sprites: loading...</div>
      <div class="sprite-status" id="engineStatus">Engine: idle</div>
    </div>
    <canvas id="canvas" width="640" height="480"></canvas>
  </div>
</main>

<script src="js/sprite_manifest.js"></script>
<script src="js/sprite_origins.js"></script>
<script src="js/gml_object_index.js"></script>
<script src="js/gml_asset_db.js"></script>
<script src="js/gml_runtime.js"></script>
<script src="js/gml_helpers.js"></script>
<script src="js/gml_compiler.js"></script>
<script src="js/gml_codegen.js"></script>
<script src="js/gml_translator.js"></script>
<script src="js/gml_presets.js"></script>
<script src="js/gml_scripts.js"></script>
<script src="js/gml_objects.js"></script>
<script src="js/gml_attacks.js"></script>
<script src="js/gml_sounds.js"></script>
<script src="js/gml_audio.js"></script>
<script src="js/sprite_indices.js"></script>
<script src="js/visual_probe.js"></script>
<script src="js/flight_recorder.js"></script>
<script src="js/spec_check.js"></script>
<script src="js/attack_specs.js"></script>
<script>
if (typeof window !== 'undefined' && typeof global === 'undefined') window.global = window;
(function() {
  'use strict';

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let runtime = new GMLRuntimeEnvironment();
  let translator = new GMLTranslator(runtime);
  let paused = false;

  // ═══════════════════════════════════════════
  // PRESET SELECTION LOADER
  // ═══════════════════════════════════════════

  const presetSelect = document.getElementById('presetSelect');

  /**
   * The attack being previewed, when it came from the real roster.
   * An attack is a controller object plus a `type` — that's how the bosses
   * dispatch them — so the type has to be applied to the spawned controller.
   */
  let pendingAttack = null;

  /** Event bundle for an object out of the extracted per-chapter tables. */
  function objectEvents(chapter, name) {
    const t = window.GML_OBJECT_EVENTS_BY_CHAPTER && window.GML_OBJECT_EVENTS_BY_CHAPTER[chapter];
    if (t && t[name]) return t[name];
    // Presets carry their own copy for the objects that have one.
    for (const [k, p] of Object.entries(window.GML_MASTER_PRESETS || {})) {
      if ((p.name || k) === name) return p;
    }
    return null;
  }

  presetSelect.innerHTML = '<option value="">-- Select an attack --</option>';

  // The real roster first: attacks named by the game itself, read out of each
  // boss's dispatcher. Everything below is raw objects, useful for isolating a
  // single bullet but NOT an attack.
  if (window.GML_ATTACKS && window.GML_ATTACKS.length) {
    // Split by whether the attack appears in the REAL fight (see
    // REAL_FIGHT_ROSTERS.md — derived from the choosers, not the dispatchers).
    // Cut content stays launchable, just labelled and listed after.
    const byBoss = {};
    for (const a of window.GML_ATTACKS) (byBoss[a.bossLabel] = byBoss[a.bossLabel] || []).push(a);
    const emit = (bossLabel, list, real) => {
      const subset = list.filter(a => (a.inFight !== false) === real);
      if (!subset.length) return;
      const g = document.createElement('optgroup');
      g.label = real ? `★ ${bossLabel} — real fight (${subset.length})`
                     : `✂ ${bossLabel} — cut / unused (${subset.length})`;
      for (const a of subset) {
        const opt = document.createElement('option');
        opt.value = 'attack:' + a.id;
        opt.textContent = `${real ? '' : '[cut] '}${a.name}${a.type !== null && a.type !== undefined ? '  (type ' + a.type + ')' : ''}`;
        g.appendChild(opt);
      }
      presetSelect.appendChild(g);
    };
    for (const [bossLabel, list] of Object.entries(byBoss)) emit(bossLabel, list, true);
    for (const [bossLabel, list] of Object.entries(byBoss)) emit(bossLabel, list, false);
  }

  if (window.GML_MASTER_PRESETS) {
    const groupObjects = document.createElement('optgroup');
    groupObjects.label = '⚙ individual objects (bullets, VFX, controllers)';
    for (const [key, p] of Object.entries(window.GML_MASTER_PRESETS)) {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = p.label;
      groupObjects.appendChild(opt);
    }
    presetSelect.appendChild(groupObjects);
  }

  presetSelect.addEventListener('change', (e) => {
    const key = e.target.value;

    if (key.startsWith('attack:')) {
      const a = (window.GML_ATTACKS || []).find(x => 'attack:' + x.id === key);
      if (!a) return;
      // A green-soul attack runs the BOSS's chart machine; the boss is the code.
      const targetObj = a.launch === 'gerson-green' ? a.enemy : a.controller;
      const ev = objectEvents(a.chapter, targetObj);
      if (!ev) {
        logError(`No event code extracted for ${targetObj}. Run scripts/gen_all.js.`);
        return;
      }
      pendingAttack = a;
      const hellWrap = document.getElementById('hellWrap');
      if (hellWrap) hellWrap.style.display = a.hasSpecial ? '' : 'none';
      document.getElementById('objName').value = targetObj;
      document.getElementById('gmlCreate').value = ev.create || '';
      document.getElementById('gmlStep').value = ev.step || '';
      document.getElementById('gmlDraw').value = ev.draw || '';
      translateAndPlay();
      return;
    }

    const p = window.GML_MASTER_PRESETS ? window.GML_MASTER_PRESETS[key] : null;
    if (p) {
      pendingAttack = null;
      document.getElementById('objName').value = p.name;
      document.getElementById('gmlCreate').value = p.create || '';
      document.getElementById('gmlStep').value = p.step || '';
      document.getElementById('gmlDraw').value = p.draw || '';
      translateAndPlay();
    }
  });

  // ═══════════════════════════════════════════
  // ERROR INTERCEPTION
  // ═══════════════════════════════════════════

  const errorLogEl = document.getElementById('errorLog');
  const uniqueErrors = new Set();

  function logError(msg) {
    if (!msg) return;
    const cleanMsg = String(msg).trim();
    if (!uniqueErrors.has(cleanMsg)) {
      uniqueErrors.add(cleanMsg);
      const countEl = document.getElementById('errCount');
      if (countEl) countEl.textContent = uniqueErrors.size;
      errorLogEl.textContent = Array.from(uniqueErrors).join('\n---\n');
    }
  }

  const btnCopy = document.getElementById('btnCopyErrors');
  if (btnCopy) {
    btnCopy.addEventListener('click', () => {
      const text = Array.from(uniqueErrors).join('\n---\n');
      if (!text) {
        btnCopy.textContent = '⚡ No Errors!';
        setTimeout(() => btnCopy.textContent = '📋 Copy Unique Errors', 1500);
        return;
      }
      navigator.clipboard.writeText(text).then(() => {
        btnCopy.textContent = '✅ Copied!';
        setTimeout(() => btnCopy.textContent = '📋 Copy Unique Errors', 1500);
      }).catch(() => {
        const area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        document.body.removeChild(area);
        btnCopy.textContent = '✅ Copied!';
        setTimeout(() => btnCopy.textContent = '📋 Copy Unique Errors', 1500);
      });
    });
  }

  const btnClear = document.getElementById('btnClearErrors');
  if (btnClear) {
    btnClear.addEventListener('click', () => {
      uniqueErrors.clear();
      if (document.getElementById('errCount')) document.getElementById('errCount').textContent = '0';
      errorLogEl.textContent = '';
    });
  }

  // Intercept console.error
  const _origError = console.error;
  console.error = function() {
    _origError.apply(console, arguments);
    const msg = Array.from(arguments).map(a => typeof a === 'object' ? (a.message || JSON.stringify(a)) : String(a)).join(' ');
    logError(msg);
  };

  // Global error handler
  window.onerror = function(msg, src, line, col, err) {
    logError('GLOBAL: ' + msg + ' (' + (src || '') + ':' + line + ')');
  };

  // ═══════════════════════════════════════════
  // TAB SWITCHING
  // ═══════════════════════════════════════════

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const target = tab.dataset.tab;
      document.getElementById('tabGML').style.display = target === 'gml' ? 'flex' : 'none';
      document.getElementById('tabJS').style.display = target === 'js' ? 'flex' : 'none';
    });
  });

  // ═══════════════════════════════════════════
  // PRESETS (based on REAL GML code from the game)
  // ═══════════════════════════════════════════

  const PRESETS = {
    knight_star: {
      name: 'obj_knight_pointing_star',
      create: `scr_bullet_init();
growspeed = 0.02;
image_xscale = 0;
image_yscale = 0;
even = false;
destroyonhit = false;
timer = 0;
con = 0;
growstart = 0;
playSound = true;
beamflicker = 0;
damage = 1;
grazepoints = 2;
element = 5;
difficulty = 0;
grazetimer = 0;
side = 0;
init = false;
mask_index = spr_knight_bullet_star_mask;
rotation = 0;
dir = choose(-1, 1);`,

      step: `if (x < (camerax() - (sprite_width / 2)) || y < (cameray() - (sprite_height / 2)) || y > (cameray() + 480 + (sprite_height / 2))) {
    instance_destroy();
    exit;
}

if (!init) {
    sprite_index = spr_knight_bullet_star;
    init = true;
}

grazetimer++;
if ((grazetimer % 4) == 0) grazed = 0;

if (con == 0) {
    image_xscale += growspeed;
    image_yscale += growspeed;
    if (image_xscale >= 1) {
        con = 1;
        speed = 2;
        direction = point_direction(x, y, obj_heart.x + 10, obj_heart.y + 10);
    }
} else if (con == 1) {
    friction = 0.5;
    con++;
} else if (con == 2) {
    mask_index = spr_knight_bullet_star_mask;
    if (speed == 0) {
        gravity = 0.1;
        gravity_direction = direction - 180;
        friction = 0;
    }
    timer++;
    if (timer >= 40) {
        timer = 0;
        con++;
    }
    growstart = image_xscale;
} else if (con == 3) {
    timer++;
    image_xscale = growstart + clamp01(timer / 2);
    image_yscale = growstart + clamp01(timer / 2);
    
    if (timer == 3) {
        var _angle = 90;
        for (i = 0; i < 6; i++) {
            d = scr_childbullet(x, y, obj_knight_pointing_starchild);
            d.image_angle = _angle;
            d.direction = _angle;
            d.speed = 4;
            d.image_xscale = image_xscale * 0.5;
            d.image_yscale = image_yscale * 0.5;
            d.deceleration = 0.15;
            d.sprite_index = spr_knight_starchild;
            _angle += 60;
        }
        active = false;
    }
    
    if (timer >= 4) {
        instance_destroy();
    }
}`,

      draw: `var _xscale = (sprite_width + 16) / sprite_get_width(sprite_index);
var _yscale = (sprite_height + 16) / sprite_get_height(sprite_index);
var _color = merge_color(c_gray, c_red, clamp01(timer / 30));
var _alpha = (sin(timer * 3) + 1) * 0.25;

draw_set_blend_mode(bm_add);
scr_draw_beam_color(x, y, 600, 10, 90, c_white, 0, _alpha, false);
draw_set_blend_mode(bm_normal);

draw_sprite_ext(sprite_index, 1, x, y, _xscale + 0.1, _yscale + 0.1, image_angle, c_white, _alpha);
draw_sprite_ext(sprite_index, 0, x, y, _xscale, _yscale, image_angle, _color, 1);`
    },

    knight_tunnel: {
      name: 'obj_knight_tunnel_slasher_2_revised',
      create: `vertical_pos = 0;
old_pos = 0;
hole_size = 60;
scr_bullet_init();
damage = 206;
timer = 0;
con = 1;
first_strike = 1;`,

      step: `timer++;

if (timer >= 8) {
    var newpos = old_pos + 15 + irandom(90);
    if (newpos > 60)
        newpos -= 120;
    
    old_pos = vertical_pos;
    vertical_pos = newpos;
    vertical_pos = clamp(vertical_pos, old_pos - 50, old_pos + 50);
    var hole_diff = abs(old_pos - vertical_pos);
    
    if (hole_diff < 20)
        hole_size = 36;
    else if (hole_diff < 30)
        hole_size = 44;
    else if (hole_diff < 40)
        hole_size = 52;
    else
        hole_size = 60;
    
    if (first_strike > 0) {
        vertical_pos = irandom_range(-15, 15);
        old_pos = vertical_pos;
        hole_size = 100;
        first_strike = scr_approach(first_strike, 0, 0.25);
    }
    
    var mbox = mean(scr_get_box(1), scr_get_box(3));
    var dorifto = 0.15 + (random(0.6) * choose(1, -1));
    
    if (vertical_pos > -20) {
        var y1 = (mbox + vertical_pos) - (hole_size * 0.5);
        var y2 = scr_get_box(1) - 40;

    if (gmlCreate.trim()) mergedEvents.create = gmlCreate;
    if (gmlStep.trim()) mergedEvents.step = gmlStep;
    if (gmlDraw.trim()) mergedEvents.draw = gmlDraw;
    mergedEvents.chapter = chapter;
    const compiled = translator.compileObject(objName, mergedEvents);

    document.getElementById('jsResult').textContent = compiled.code;

    if (compiled.errors.length > 0) {
      logError('Transpiler warnings:\n' + compiled.errors.join('\n'));
    }

    // Reset runtime
    runtime = new GMLRuntimeEnvironment();
    window.activeGMLRuntime = runtime;
    runtime.$chapter = compiled.chapter;
    translator = new GMLTranslator(runtime);
    GML_HELPERS.for(runtime);

    // Battle globals live on window (GML `global`), so they leak between runs.
    // The turn CLOCK starts at zero: `scr_turntimer(n)` is a max-clamp, so the
    // boss's pre-attack floor and the controller's own duration compose on top
    // of 0 exactly as they do in game. (It must NOT be pre-set high — that is
    // what neutralised every scr_turntimer call and stopped attacks ending.)
    window.turntimer = 0;
    // The countdown gate. The real value is set by the turn state machine;
    // "bullets are flying" is mnfight 2, which is the phase the studio recreates.
    window.mnfight = 2;
    window.interact = 0;
    turnEndedAt = null;

    // Silence the previous attack's sounds and loops.
    if (window.GML_AUDIO) GML_AUDIO.stopAll();

    // Box outline + SOUL join the depth pipeline at depth 0: negative-depth
    // bullets draw over them, positive-depth background under.
    runtime.$overlays = [
      { depth: 0, tie: 1e9, draw: drawBoxOverlay },
      { depth: 0, tie: 1e9 + 1, draw: drawSoulOverlay },
    ];

    // Soul mode per boss: Spamton NEO fights use the yellow (justice) soul.
    soulMode = ((pendingAttack && pendingAttack.boss === 'spamton_neo')
      || objName.toLowerCase().includes('sneo')
      || objName.toLowerCase().includes('spamton')) ? 'yellow' : 'red';
    yCharging = false;
    yChargeFrames = 0;

    /** Evaluate one generated class and register it. */
    function registerUnit(name, code) {
      const cls = new Function('GMLInstance', 'runtime', code + ';\nreturn ' + name + ';')(GMLInstance, runtime);
      runtime.registerObject(name, cls);
      return cls;
    }

    try {
      // Everything except the object under test compiles JUST-IN-TIME: classes
      // when something first spawns them ($R.ensureClass, wired into
      // createInstance) and scripts when first called ($R.scrCall). Compiling a
      // chapter's ~600 objects and ~600 scripts up front blocked the page for
      // minutes once the extraction became complete.
      // The class under test extends $R.base(parent) — make sure the parent
      // chain exists before evaluating it.
      {
        const oi = window.GML_OBJECT_INDEX;
        const par = oi ? oi.defaults(objName, compiled.chapter).parent : null;
        if (par) GML_HELPERS.for(runtime).ensureClass(par);
      }
      registerUnit(objName, compiled.code);

      const status = document.getElementById('engineStatus');
      if (status) {
        const nScripts = Object.keys((window.GML_SCRIPT_SOURCES_BY_CHAPTER || {})[compiled.chapter] || {}).length;
        const nObjects = Object.keys((window.GML_OBJECT_EVENTS_BY_CHAPTER || {})[compiled.chapter] || {}).length;
        status.textContent = `${nScripts} scripts · ${nObjects} objects (JIT) · chapter ${compiled.chapter.replace('ch', '')}`;
      }

      // The party EXISTS but is not DRAWN.
      //
      // They have to exist because attacks read them for positioning —
      // scr_moveheart is literally `instance_create(obj_herokris.x + 10,
      // obj_herokris.y + 40, obj_moveheart)`, and several attacks aim at party
      // members. Deleting them would send those reads to a dead reference and
      // put bullets at (0,0).
      //
      // They are not drawn because this studio shows ONE ATTACK, not a battle:
      // the party is turn-system furniture, it competes for depth with the
      // attack's own visuals, and their real on-screen placement is decided by
      // battle code we deliberately do not run. Sprites are left at the object
      // defaults — with visible = false the idle-sprite overrides this used to
      // carry were pure guesswork anyway.
      for (const name of ['obj_herosusie', 'obj_heroralsei', 'obj_mainchara', 'obj_herokris']) {
        const inst = runtime.createInstance(name, 120, 240);
        if (inst) { inst.visible = false; inst.step = null; }
      }
      // obj_battlecontroller EXISTS but does not run and does not draw.
      //
      // It has to exist because attacks re-depth themselves against it
      // (`with (obj_battlecontroller) depth = obj_growtangle.depth + 2`) and
      // read its fields. But its Step and Draw are the battle MENU — FIGHT/ACT/
      // ITEM/SPARE, the two purple menu lines, the cursor sounds — plus the turn
      // state machine that re-picks each enemy's attack. Letting it run put a
      // half-working menu (with SFX) on top of every single attack, fought the
      // roster's choice of attack, and moved the box.
      //
      // The turn CLOCK is the one thing we do want from it, and tickTurnTimer()
      // implements exactly that block's semantics instead.
      {
        const bc = runtime.createInstance('obj_battlecontroller', 0, 0);
        if (bc) { bc.step = null; bc.visible = false; }
      }

      // Auto-spawn parent attack controllers for child bullet objects so full attack patterns run
      const PARENT_CONTROLLERS = {
        'obj_knight_pointing_star': 'obj_knight_pointing_cone',
        'obj_knight_pointing_starchild': 'obj_knight_pointing_cone',
        'obj_knight_roaring_star': 'obj_knight_roaring2',
        'obj_knight_diamondswordbullet_ext': 'obj_knight_tunnel_slasher_2_revised',
        'obj_knight_fallingsword': 'obj_knight_swordfall',
        'obj_gerson_hammer_bullet': 'obj_gerson_hammer_bro_attack_controller',
        'obj_sneo_head': 'obj_sneo_wall_controller_new',
        'obj_sneo_bomb': 'obj_sneo_wall_controller_new'
      };

      if (PARENT_CONTROLLERS[objName]) {
        const parentName = PARENT_CONTROLLERS[objName];
        if (!runtime.instances.some(i => i.object_name === parentName)) {
          runtime.createInstance(parentName, 320, 240);
        }
      }

      // ── THE REAL BATTLE BOX ──
      // The runtime constructor's fake singleton never ran Step or Draw; drop
      // it. The REAL obj_growtangle is created by the BOSS'S OWN GML below —
      // each boss's box-setup block (GML_ATTACKS_BOXSETUP) and each attack's
      // dispatcher branch (attack.setup) are replayed verbatim with self = the
      // boss, so position, maxxscale/maxyscale, purple controls and heart
      // markers all come out exactly as the real fight makes them.
      {
        const old = runtime.growtangle;
        if (old) {
          old.destroyed = true;
          runtime.instances = runtime.instances.filter(i => i !== old);
        }
        runtime.growtangle = null;
      }
      const lowerName = objName.toLowerCase();
      /**
       * The boss instance every attack reads for its anchor position.
       *
       * Gerson's boss object is `obj_hammer_of_justice_enemy` — there is no
       * `obj_gerson_enemy` in the game. The studio used to spawn that made-up
       * name, so all 67 `obj_hammer_of_justice_enemy` references in the Gerson
       * attacks resolved to an empty proxy sitting at the default (320, 240)
       * instead of the real boss.
       *
       * Sprites come from the object defaults; only extras that the enemy's own
       * Create would normally set are named here.
       */
      const BOSSES = [
        { match: ['knight', 'roaring', 'sword'], name: 'obj_knight_enemy', x: 520, y: 180 },
        { match: ['sneo', 'spamton'], name: 'obj_spamton_neo_enemy', x: 520, y: 160, sprite: 'spr_sneo_body' },
        // No `also` list. It used to co-spawn obj_sound_of_justice_enemy on the
        // assumption that it was part of this fight; it is a separate enemy
        // drawn as spr_statue_sound_of_justice, so it appeared as a second,
        // wrong-looking "Gerson" standing in the arena.
        { match: ['gerson', 'hammer', 'cane', 'justice', 'spear'], name: 'obj_hammer_of_justice_enemy', x: 520, y: 180 },
        { match: ['joker', 'jevil'], name: 'obj_joker', x: 520, y: 180 },
        { match: ['pink'], name: 'obj_pink_enemy', x: 520, y: 180 },
      ];
      let bossInst = null;
      for (const b of BOSSES) {
        // A roster attack knows its own boss; guessing from the object name is
        // only for the raw-object list.
        const isMine = pendingAttack
          ? pendingAttack.enemy === b.name
          : b.match.some(m => lowerName.includes(m));
        if (!isMine) continue;
        const boss = runtime.createInstance(b.name, b.x, b.y);
        bossInst = boss;
        if (b.sprite) boss.sprite_index = b.sprite;
        GML_HELPERS.for(runtime).syncImageNumber(boss);
        boss.image_speed = 0.2;
        // Fields the boss's own turn logic would have set before attacking; the
        // attacks read these for positioning and scaling.
        boss.myself = 0;
        boss.difficulty = 1;
        // Only the object under test should drive its own Step.
        if (objName !== b.name) boss.step = null;
        for (const extra of b.also || []) {
          if (objName === extra) continue;
          const e = runtime.createInstance(extra, b.x, b.y);
          if (e) e.step = null;
        }
        break;
      }

      // Spawn the thing under test.
      let mainInst = null;
      const bossObjectNames = new Set(BOSSES.map(b => b.name));
      const diff = Number((document.getElementById('diffSelect') || { value: 1 }).value);
      const hell = !!(document.getElementById('hellChk') || {}).checked;
      if (bossInst) {
        bossInst.difficulty = diff;
        bossInst.mytarget = 0;
        // Always a number: the sneo dispatcher READS hellmode (`dc.special =
        // hellmode`), and an unset read would materialise a truthy auto-array.
        bossInst.hellmode = hell ? 1 : 0;
        // The box block and the dispatcher branch both self-select on this.
        if (pendingAttack && pendingAttack.selector && pendingAttack.choice !== null) {
          bossInst[pendingAttack.selector] = pendingAttack.choice;
        }
      }

      const H2 = GML_HELPERS.for(runtime);

      // Battle arrays the dispatcher branches write into. The boss's Create
      // (scr_monstersetup) usually seeds them, but never leave them undefined —
      // `global.monsterat[myself] * 4` in Jevil's branch would throw.
      if (!Array.isArray(window.monsterattackname)) window.monsterattackname = [''];
      if (!Array.isArray(window.monsterat)) window.monsterat = [10];
      if (!Array.isArray(window.monster)) window.monster = [1];
      // Pink's date controller reads global.flag[1706..1708] ("have you seen
      // this date before") in its Create; an unseeded global array throws.
      if (!Array.isArray(window.flag)) window.flag = [];
      if (!Array.isArray(window.tempflag)) window.tempflag = [];

      // scr_moveheart tweens the heart via obj_moveheart from obj_herokris —
      // battle furniture the studio doesn't run. Same contract, direct: put
      // the soul at the box centre.
      H2.scr.scr_moveheart = function () {
        const g = runtime.instances.find(i => !i.destroyed && i.object_name === 'obj_growtangle');
        if (g) centreSoulOn(g.x, g.y);
        return runtime.soul;
      };

      /** Compile a raw GML fragment and run it with self = `self`. */
      function runSnippet(gml, self, label) {
        if (!gml || !self) return false;
        try {
          const c = translator.compileObject('__setup_snippet', { chapter, step: gml });
          if (c.errors.length) logError(label + ' warnings:\n' + c.errors.join('\n'));
          const cls = new Function('GMLInstance', 'runtime',
            c.code + ';\nreturn __setup_snippet;')(GMLInstance, runtime);
          cls.prototype.step.call(self);
          return true;
        } catch (e) {
          logError(label + ' replay failed: ' + e.message);
          return false;
        }
      }

      /** Adopt whatever growtangle the replayed GML created. */
      function syncGrowtangle() {
        const g = runtime.instances.find(i => !i.destroyed && i.object_name === 'obj_growtangle');
        if (g) runtime.growtangle = g;
        return g;
      }

      // The boss's own box-setup block, before the dispatcher — the order the
      // real turn runs them in. The Knight's block opens with event_user(0),
      // his ATTACK CHOOSER, which would override the roster pick with his own
      // turn sequence (and size the box for the wrong attack) — stub it for
      // the replay only; the studio is the chooser here.
      // A DATE has no battle box at all: Pink's own `mnfight == 1.5` prep skips
      // the growtangle when a date is pending, and the date draws on its own
      // full-screen surfaces. Replaying the box block would add a box the real
      // fight never shows. Same for the type-210 finale, which destroys the box.
      const isDate = !!(pendingAttack && pendingAttack.launch === 'pink-date');

      // The box block is part of the BOSS'S TURN, so replay it only for attacks
      // the boss itself dispatches (they carry the selector variable its branch
      // keys on). An attack announced by a helper object — Pink's date
      // controller spawning the type-210 finale — is not part of that turn, and
      // replaying the turn's setup injects objects the real sequence never has.
      // Concretely: Pink's block creates obj_purplecontrols, whose one-time
      // `made` latch then fires under its DEFAULT mode, so when the finale later
      // sets mode = 8 the node-maze builder has already been spent and the maze
      // never appears.
      const bossDispatched = !!(pendingAttack && pendingAttack.selector !== null
        && pendingAttack.selector !== undefined);

      // Set when the chart boss's event_user(0) already ran before the box
      // replay; the chart-launch path must not run it a second time.
      let chartPrebuilt = false;
      if (pendingAttack && bossInst && !isDate && bossDispatched) {
        const boxGML = (window.GML_ATTACKS_BOXSETUP || {})[pendingAttack.boss];
        if (boxGML) {
          // A boss-driven CHART picks its box offset in event_user(0), so that
          // has to run before the box block reads it. Gerson's block ends with
          // `with (obj_growtangle) { if (other.boxoffset) y -= 50; }` and
          // `attackpattern > 69 && attackpattern < 72` sets boxoffset in
          // Other_10 — so patterns 70 and 71 place their box at y 190, not the
          // default 240. Replaying the box first read a boxoffset that had not
          // been chosen yet.
          //
          // Only for the chart bosses: a controller attack's event_user(0) is
          // the boss's own attack CHOOSER, which would override the roster pick
          // (the trap this block already guards against by stubbing eventUser).
          if (pendingAttack.selector === 'attackpattern') {
            try {
              // Full green-boss prep, ONCE. The chart-launch path below used
              // to fire event_user(0) again, and Other_10 is not idempotent:
              // swingdownbeatspeed decrements at the end of a branch (23 -> 21
              // instead of 22 on green10), and shield-mode rows duplicated —
              // green18's shield was dead by frame 100 because special-35
              // swaps ran twice.
              bossInst.attackpattern = pendingAttack.pattern !== undefined
                ? pendingAttack.pattern : pendingAttack.choice;
              bossInst.trueturn = 1;
              bossInst.attacked = 0;
              H2.eventUser(bossInst, 0);
              chartPrebuilt = true;
            } catch (e) { /* the chart replay below still runs */ }
          }
          // Swap the DISPATCH helper, not a property on the instance — reading
          // an unset instance property materialises the truthy auto-array.
          const savedEventUser = H2.eventUser;
          H2.eventUser = function () { return 0; };
          runSnippet(boxGML, bossInst, 'box setup');
          H2.eventUser = savedEventUser;
          syncGrowtangle();
        }
      }

      if (isDate && bossInst) {
        // The dating minigame is a TURN REPLACEMENT, not a bullet attack: Pink's
        // dispatcher does `datecount++` and creates obj_date_controller, which
        // reads obj_pink_enemy.datecount in its own Create to pick the date.
        // So datecount must be set BEFORE the controller exists.
        bossInst.datecount = pendingAttack.datecount;
        // Date 3 is gated on `phaseturns >= 3` in the real fight, and its
        // scripted timeline (which ends in the type-210 finale) reads it.
        bossInst.phaseturns = 3;
        bossInst.doki = 0;
        window.turntimer = 999;
        const bc = runtime.instances.find(i => i.object_name === 'obj_battlecontroller');
        const dcDepth = (bc ? Number(bc.depth) || 0 : 0) - 9999999;
        mainInst = runtime.createInstance('obj_date_controller', bossInst.x, bossInst.y);
        if (mainInst) mainInst.depth = dcDepth;
      } else if (pendingAttack && pendingAttack.launch === 'gerson-green' && bossInst) {
        // The boss IS the attack. Other_10 fills the list_attack*[] chart for
        // this pattern; attackcon = 1 starts the machine that feeds
        // scr_spearshot row by row. The boss's Step stays ACTIVE for these
        // (the BOSSES loop leaves it on because objName === the boss).
        mainInst = bossInst;
        bossInst.attackpattern = pendingAttack.pattern;
        bossInst.trueturn = 1;
        // Left at 0 deliberately. `attacked` gates the boss's dispatcher, but
        // that branch also needs phase "bullets", which we withhold for a
        // boss-driven chart — so it cannot fire anyway, and parts of the
        // attackcon machine read `attacked` as still-attacking.
        bossInst.attacked = 0;
        // Other_10 is NOT idempotent (counter decrements, shield-mode swaps);
        // skip when the box-ordering block already built this chart.
        if (!chartPrebuilt) GML_HELPERS.for(runtime).eventUser(bossInst, 0);
        bossInst.attackcon = 1;
        // The boss's dispatcher sets attackcon and the turn length on the SAME
        // line (`attackcon = 1; ... scr_turntimer(999);`). Setting attackcon by
        // hand skipped the duration, so every green chart was cut off at the
        // 90-frame pre-attack floor and the spears vanished mid-pattern.
        bossInst.rudebusterhitcount = 0;
        H2.scrCall('scr_turntimer', bossInst, [999]);
      } else if (!bossObjectNames.has(objName)) {
        // THE BOX MUST EXIST BEFORE THE CONTROLLER DOES.
        //
        // In the real game the boss's Step creates obj_growtangle in its
        // `mnfight == 2` block, long before it dispatches an attack, so any
        // controller reading `obj_growtangle.x` in its Create finds a real box.
        // The studio was creating its fallback box AFTER the controller, so
        // controllers that anchor on it read a missing object:
        // obj_gerson_box_rumble_controller's `anchor_x = obj_growtangle.x`
        // came out -9999 (and 260 on another run — it varied, which is what
        // gave it away), and obj_gerson_bell_attack_controller placed its bell
        // and teleport 60px off. Bosses whose own box block is replayed above
        // already have one; this only covers the fallback case.
        if (!runtime.instances.some(i => !i.destroyed && i.object_name === 'obj_growtangle')) {
          try {
            H2.ensureClass('obj_growtangle');
            runtime.growtangle = runtime.createInstance('obj_growtangle', 320, 170);
          } catch (e) { /* fall through to the adoption block below */ }
        }
        if (pendingAttack) {
          // Replay the attack's WHOLE dispatcher branch with self = the boss.
          // The branch does everything the real turn does — box tweaks,
          // obj_purplecontrols with its `.mode`, heart markers, then
          // scr_bulletspawner with type/difficulty — so nothing is guessed.
          if (pendingAttack.setup && bossInst
              && runSnippet(pendingAttack.setup, bossInst, 'dispatcher')) {
            for (let i = runtime.instances.length - 1; i >= 0; i--) {
              const inst = runtime.instances[i];
              if (!inst.destroyed && inst.object_name === pendingAttack.controller) {
                mainInst = inst;
                break;
              }
            }
          }
          // Manual fallback (unbraced branches, replay errors): spawn the
          // controller exactly as the boss does. scr_bulletspawner stamps
          // creator/creatorid/target/damage — a direct createInstance left all
          // four unset, which subtly corrupted every attack that reads them.
          if (!mainInst) {
            const bx = bossInst ? bossInst.x : 320;
            const by = bossInst ? bossInst.y : 180;
            if (bossInst) {
              // scrCall JIT-compiles scr_bulletspawner on first use.
              mainInst = H2.scrCall('scr_bulletspawner', bossInst, [bx, by, objName]);
            }
            if (!mainInst || typeof mainInst !== 'object') {
              mainInst = runtime.createInstance(objName, bx, by);
            }
            if (mainInst) {
              if (pendingAttack.type !== null && pendingAttack.type !== undefined) {
                mainInst.type = pendingAttack.type;
              }
              // A dispatcher that pins a literal (`dc.difficulty = 0`) means that
            // value IS the attack — Pink's finale pins 0 because obj_pinknodeact
            // ramps it 0->4 itself as nodes are cleared. Only forward the UI
            // setting where the boss passes its own difficulty through.
            if (pendingAttack.difficultyLiteral !== null && pendingAttack.difficultyLiteral !== undefined) {
              mainInst.difficulty = pendingAttack.difficultyLiteral;
            } else if (pendingAttack.usesDifficulty) {
              mainInst.difficulty = diff;
            }
            }
          }
          if (mainInst) {
            if (pendingAttack.hasSpecial && hell) mainInst.special = 1;
            // Boss-specific controller flags (e.g. ch1 sets `joker = 1` on the
            // controller after dispatch, and its whole Jevil section gates on it).
            if (pendingAttack.controllerSet) Object.assign(mainInst, pendingAttack.controllerSet);
          }
        } else {
          mainInst = runtime.createInstance(objName, 320, 240);
          // A child bullet tested on its own never gets its controller's cue to
          // advance, so nudge it past the idle state.
          if (mainInst && mainInst.con === 0) mainInst.con = 2;
        }
      }

      // Adopt whatever box the replayed GML created; only if NO code made one
      // (raw objects, replay failures) fall back to a default box — the real
      // object still, so its Create/Step run the grow machine either way.
      if (!isDate) {
        let gt = syncGrowtangle();
        if (!gt) {
          H2.ensureClass('obj_growtangle');
          gt = runtime.createInstance('obj_growtangle', 320, 170);
          runtime.growtangle = gt;
        }
        // Purple attacks: obj_purplecontrols owns the soul (canmove = 0).
        // Everyone else starts centred in the box, as scr_moveheart leaves it.
        // Centred means the soul's MIDDLE, not its top-left anchor.
        if (Number(runtime.soul.canmove) !== 0 || isNaN(runtime.soul.x)) {
          centreSoulOn(gt.x, gt.y);
        }
      }

      // If nothing in the replayed GML set a duration, apply the same
      // pre-attack floor the bosses themselves use (`scr_turntimer(90)` in the
      // mnfight == 1.5 block). Controllers that set their own longer duration on
      // their first Step still raise it, because scr_turntimer only clamps up.
      // The boss's TURN-LENGTH ladder, replayed like the box block. It lives
      // outside the dispatcher branch, so the per-attack `setup` slice cannot
      // contain it, and without it every attack fell back to the 90-frame floor
      // below — which for the Knight's Stars meant `global.turntimer += 30`
      // producing 120 against its own `endtimer` of 120, so it hit its
      // terminate check on frame ONE and never spawned a star.
      if (pendingAttack && bossInst && bossDispatched) {
        const turnGML = (window.GML_ATTACKS_TURNSETUP || {})[pendingAttack.boss];
        if (turnGML) {
          // The block may RAISE the clock but never LOWER what the dispatcher
          // already set, because the two orderings differ per boss and this
          // replay only has one.
          //
          // The Knight's ladder genuinely runs AFTER his dispatcher, and sets
          // through scr_turntimer, which is raise-only anyway. Jevil is the
          // mirror image: obj_joker's Step assigns a flat
          // `global.turntimer = 240` and THEN calls event_user(5), so the
          // per-attack values inside Other_15 (300 for jattack 5, 330 for 13,
          // 1500 for BYE BYE) are meant to win. Replaying the block afterwards
          // clobbered all six back down to 240.
          const before = Number(window.turntimer) || 0;
          runSnippet(turnGML, bossInst, 'turn length');
          if ((Number(window.turntimer) || 0) < before) window.turntimer = before;
        }
      }

      if (!(Number(window.turntimer) > 0)) window.turntimer = 90;
      // Re-assert the phase LAST. obj_battlecontroller's own Create resets
      // global.mnfight to 0 (it expects to be created before a fight begins),
      // and its Step only counts the turn down while mnfight == 2 — so setting
      // the phase before the battle context is built silently disables the clock.
      //
      // EXCEPT for a boss-driven chart (Gerson's green soul). There the BOSS is
      // the attack: we hand-select a pattern, call its chart builder and start
      // its attackcon machine. Phase "bullets" also unlocks the boss's own
      // dispatcher, which re-picks the pattern from `trueturn` and resets rtimer
      // every step — it fights the launch and nothing spawns. The boss owns its
      // own timing here, so leave the phase alone and let it drive.
      if (!(pendingAttack && pendingAttack.launch === 'gerson-green')) window.mnfight = 2;

      // Keep this short: the readouts in the top-right share the row.
      const label = pendingAttack ? pendingAttack.name : objName;
      document.getElementById('statusText').textContent = 'Running ' + label;
      document.getElementById('statusText').style.color = '#38d878';
    } catch(err) {
      document.getElementById('statusText').textContent = 'Error';
      document.getElementById('statusText').style.color = '#ff5a5a';
      logError('TRANSLATION ERROR:\n' + err.message + '\n' + err.stack);
    }
  }

  document.getElementById('btnTranslate').addEventListener('click', translateAndPlay);
  document.getElementById('btnReset').addEventListener('click', () => {
    runtime = new GMLRuntimeEnvironment();
    uniqueErrors.clear();
    if (document.getElementById('errCount')) document.getElementById('errCount').textContent = '0';
    errorLogEl.textContent = '';
    document.getElementById('statusText').textContent = 'Ready';
    document.getElementById('statusText').style.color = '';
  });
  document.getElementById('btnPause').addEventListener('click', () => {
    paused = !paused;
    document.getElementById('btnPause').textContent = paused ? '▶ Resume' : '⏸ Pause';
  });

  /**
   * Let the deterministic probes freeze the live loop.
   *
   * VISUAL_PROBE and SPEC_CHECK step the runtime themselves, but they must wait
   * ~350ms after launching for sprite bitmaps to DECODE — and the rAF loop kept
   * running through that wait, advancing the game by however many frames the
   * machine got through. So "frame 8" was really "frame 8 plus a machine-speed
   * dependent number", and `global.turntimer` read ~11 short of the value the
   * boss had just set (350ms at 30fps), failing 32 turn-length assertions that
   * were all correct. Freezing the loop makes a measured frame mean the frame.
   */
  window.GML_STUDIO_SET_PAUSED = function (v) {
    const was = paused;
    paused = !!v;
    document.getElementById('btnPause').textContent = paused ? '▶ Resume' : '⏸ Pause';
    return was;
  };

  // ═══════════════════════════════════════════
  // MAIN GAME LOOP (CRASH-PROOF)
  // ═══════════════════════════════════════════

  let lastTime = performance.now(), frameCount = 0, fps = 60;
  let lastStepTime = performance.now();
  const stepInterval = 1000 / 30; // Fixed 30 FPS step cadence (GameMaker room_speed = 30 1:1)

  function gameLoop(now) {
    // FPS counter
    frameCount++;
    if (now - lastTime >= 1000) {
      fps = frameCount;
      frameCount = 0;
      lastTime = now;
      document.getElementById('fpsText').textContent = fps;
    }

    // Update sprite status
    if (gmlAssets) {
      const st = gmlAssets.getLoadStatus();
      if (st.requested > 0) {
        document.getElementById('spriteStatus').textContent =
          `Sprites: ${st.loaded}/${st.requested} loaded` + (st.failed > 0 ? ` (${st.failed} failed)` : '');
      } else {
        document.getElementById('spriteStatus').textContent = 'Sprites: Ready';
      }
    }

    // Soul movement
    try { updateSoul(); } catch(e) { /* soul movement should never crash */ }

    // Step all instances at fixed 30 FPS (GameMaker room_speed = 30 1:1)
    const dt = now - lastStepTime;
    if (dt >= stepInterval) {
      if (!paused) {
        // Feed held + pressed-edge input to the game's *_h()/*_p()/button*
        // functions once per STEP (obj_spearblocker aims the green shield with
        // these; edges must be per game step, not per key event).
        {
          const gi = window.$gmlInput || (window.$gmlInput = {});
          const dn = {
            l: !!(keys['ArrowLeft'] || keys['a'] || keys['A']),
            r: !!(keys['ArrowRight'] || keys['d'] || keys['D']),
            u: !!(keys['ArrowUp'] || keys['w'] || keys['W']),
            d: !!(keys['ArrowDown'] || keys['s'] || keys['S']),
            z: !!(keys['z'] || keys['Z'] || keys['Enter']),
            x: !!(keys['x'] || keys['X'] || keys['Shift']),
            c: !!(keys['c'] || keys['C']),
          };
          gi.lp = dn.l && !gi.l; gi.rp = dn.r && !gi.r;
          gi.up = dn.u && !gi.u; gi.dp = dn.d && !gi.d;
          gi.zp = dn.z && !gi.z; gi.xp = dn.x && !gi.x; gi.cp = dn.c && !gi.c;

          // The game's OWN input scripts (up_h, left_p, button1_h...) read
          // global.input_held / input_pressed / input_released — arrays that
          // obj_time normally fills. Feed them directly with the real index
          // layout: 0=down 1=right 2=up 3=left, 4/7=confirm, 5/8=cancel,
          // 6/9=menu. Without these the compiled input scripts saw zeros, which
          // is why the green-soul shield never rotated.
          window.input_held = [dn.d, dn.r, dn.u, dn.l, dn.z, dn.x, dn.c, dn.z, dn.x, dn.c].map(Number);
          window.input_pressed = [gi.dp, gi.rp, gi.up, gi.lp, gi.zp, gi.xp, gi.cp, gi.zp, gi.xp, gi.cp].map(Number);
          window.input_released = [
            !dn.d && gi.d, !dn.r && gi.r, !dn.u && gi.u, !dn.l && gi.l,
            !dn.z && gi.z, !dn.x && gi.x, !dn.c && gi.c,
            !dn.z && gi.z, !dn.x && gi.x, !dn.c && gi.c,
          ].map(Number);

          gi.l = dn.l; gi.r = dn.r; gi.u = dn.u; gi.d = dn.d;
          gi.z = dn.z; gi.x = dn.x; gi.c = dn.c;
        }
        try { runtime.step(); } catch(e) {
          logError('STEP CRASH: ' + e.message);
        }
        try { tickTurnTimer(); } catch(e) { logError('turn timer: ' + e.message); }
        if (yCharging) yChargeFrames++;   // z_hold, in game steps
        if (yShotDelay > 0) yShotDelay--; // chargeshot_delay--
        // `if (z_hold >= 40) image_index = 2;` — the heart's own charged frame.
        if (soulMode === 'yellow' && runtime && runtime.soul) {
          runtime.soul.image_index = (yCharging && yChargeFrames >= 40) ? 2 : 0;
        }
      }
      lastStepTime = now - (dt % stepInterval);
    }

    // ── RENDER ──
    // PAUSE MUST STOP DRAWING TOO, not just stepping.
    //
    // Deltarune MUTATES STATE IN DRAW EVENTS — obj_dbullet_vert fades itself in
    // with `image_alpha += 0.1` from its Draw, obj_gerson_green_chevron spawns
    // the green-soul shield from its Draw. So a paused-but-still-drawing loop
    // keeps advancing the game. The deterministic probes wait ~350ms for sprite
    // bitmaps to decode, and at 60fps that was ~20 free Draw passes: Jevil's
    // type 25 spades read image_alpha 3.8 where Create sets 0, and type 74 read
    // 1.1 against an expected 0-0.15. Pausing here makes a paused studio
    // genuinely frozen.
    if (paused) { requestAnimationFrame(gameLoop); return; }
    // Set active context for drawing functions
    setActiveCtx(ctx);

    // Clear canvas
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw everything through the depth pipeline. The box outline and the SOUL
    // are runtime overlays at depth 0 (registered in translateAndPlay), so
    // negative-depth bullets correctly pass OVER them and positive-depth
    // sprites sit behind — they are no longer painted before/after everything.
    try { runtime.draw(ctx); } catch(e) {
      logError('DRAW CRASH: ' + e.message);
    }

    // Instance count
    document.getElementById('instCount').textContent = runtime.instances.length;

    // ALWAYS schedule next frame
    requestAnimationFrame(gameLoop);
  }

  // Start the loop
  requestAnimationFrame(gameLoop);

  // Auto-load first valid boss attack controller preset
  for (let i = 0; i < presetSelect.options.length; i++) {
    if (presetSelect.options[i].value) {
      presetSelect.selectedIndex = i;
      presetSelect.dispatchEvent(new Event('change'));
      break;
    }
  }

})();
</script>
</body>
</html>
